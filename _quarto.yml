project:
  type: book
  output-dir: docs       # HTML files will be placed in docs/ for GitHub Pages

book:
  title: "ECON 706"
  author: "Robert M. McNab"
  chapters:
    - part: "Introduction"
      chapters:
        - index.qmd
        - mcnab.qmd
        - about.qmd
    - part: "Linear Regression Model"
      chapters:
        - mod-1-0-overview.qmd
        - mod-1-1-matrix.qmd
        - mod-1-2-model.qmd
    - part: "Least Squares Estimator"
      chapters:
        - mod-2-0-overview.qmd
        - mod-2-1-derivation.qmd
        - mod-2-2-matrix.qmd
        - mod-2-3-orthogonality.qmd
    - part: "Partitioned Regression"
      chapters:
        - mod-3-0-overview.qmd
        - mod-3-1-orthogonal.qmd
        - mod-3-2-partitioned.qmd
    - part: "Goodness of Fit"
      chapters:
        - mod-4-0-overview.qmd
        - mod-4-1-means.qmd
        - mod-4-2-rsquared.qmd
    - part: "Least Squares Variance"
      chapters:
        - mod-5-0-overview.qmd
        - mod-5-1-unbiased.qmd
        - mod-5-2-variance.qmd
    - part: "Hypothesis Testing"
      chapters:
        - mod-6-0-overview.qmd
        - mod-6-1-hypothesis.qmd

execute:
  webR: true            # enables WebR chunks for interactive R in the browser
  
filters:
  - webr                # activates the webR filter globally
  
webr:
  packages: [dplyr, ggplot2, knitr]
  show-startup-message: true
  show-header-message: true

format:
  html:
    toc: true
    toc-location: right
    self-contained: false   # recommended for WebR to load JS modules correctly
    link-external-newwindow: true  # open all links in new tabs


